# RoboTwin Image Environment Configuration
name: robot_image
dataset_class: dyn_model.datasets.robot_image_dset.RobotImageDynamicsModelDataset

# Dataset paths
# Based on process_data.py logic: data/{task_name}-{task_config}-{num}.zarr
train_data_path: /home/ubuntu/fjh/workbench/RoboTwin/policy/DP/data/move_pillbottle_pad-demo_clean-50.zarr
val_data_path: /home/ubuntu/fjh/workbench/RoboTwin/policy/DP/data/move_pillbottle_pad-demo_clean-50.zarr

# Dataset parameters
# Key names must match process_data.py: "head_camera"
view_names: ['head_camera']
encoder_type: 'resnet'
return_rewards: false

# Action and Proprioception dimensions
# From default_task_14.yaml: agent_pos [14], action [14]
action_dim: 14  
proprio_dim: 14 

# Image dimensions
# From default_task_14.yaml: image_shape [3, 224, 224]
original_img_size: [240, 320]
cropped_img_size: 224  # Set to same if no random crop is desired during dyna training

# Model embeddings
action_emb_dim: 256
proprio_emb_dim: 32

# Policy checkpoint
policy_ckpt_path: /home/ubuntu/fjh/workbench/RoboTwin/policy/DP/data/outputs/move_pillbottle_pad-maniflow_image_timm_policy_robotwin2-1001_seed0/checkpoints/latest.ckpt

# Shape meta for observations
shape_obs:
  agent_pos:
    shape: [14]
  head_camera:
    shape: [3, 224, 224]
    type: 'rgb'
